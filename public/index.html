<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Imagen 3 AI Studio & Drive Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.8);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --bubble-user: #27273a;
      --bubble-ai: #141b2d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top center, #17153b 0%, var(--bg) 80%);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
      background: rgba(9, 13, 22, 0.85);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.05rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .brand h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    /* Mobile-only view toggle pills */
    .mobile-view-toggle {
      display: flex;
      background: rgba(15, 23, 42, 0.7);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
    }

    /* On Desktop (>= 1024px), hide mobile toggle tabs */
    @media (min-width: 1024px) {
      .mobile-view-toggle {
        display: none;
      }
    }

    /* Drive status indicator */
    .drive-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }

    .auth-btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .disconnect-btn {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    /* Main Responsive Container */
    main {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    /* DESKTOP SPLIT-SCREEN LAYOUT (>= 1024px) */
    @media (min-width: 1024px) {
      main {
        display: grid;
        grid-template-columns: 520px 1fr;
      }

      .pane {
        display: flex !important;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      #chatPane {
        border-right: 1px solid var(--card-border);
      }
    }

    /* MOBILE SINGLE-PANE VIEW (< 1024px) */
    @media (max-width: 1023px) {
      .pane {
        display: none;
        width: 100%;
        height: 100%;
      }

      .pane.active {
        display: flex;
      }
    }

    /* Chat Pane Styling */
    .chat-pane-wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1rem 5.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 90%;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--bubble-user);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      font-size: 0.92rem;
    }

    .message.ai {
      align-self: flex-start;
      background: var(--bubble-ai);
      border: 1px solid var(--card-border);
      border-radius: 16px 16px 16px 4px;
      overflow: hidden;
      width: 100%;
    }

    .ai-img-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ai-img-wrapper img {
      width: 100%;
      height: auto;
      max-height: 420px;
      object-fit: contain;
      display: block;
    }

    .ai-content {
      padding: 12px 14px;
    }

    .ai-prompt {
      font-size: 0.85rem;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .ai-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.75rem;
    }

    .action-pill {
      background: rgba(255, 255, 255, 0.06);
      color: var(--accent);
      padding: 5px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--card-border);
      transition: all 0.2s;
    }

    .action-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Fixed Bottom Input Bar */
    .chat-input-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      padding: 8px 12px 14px 12px;
      z-index: 40;
    }

    .pill-options {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .pill-options::-webkit-scrollbar { display: none; }

    .option-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .option-chip.active {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--primary);
      color: #fff;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }

    .input-box:focus {
      border-color: var(--accent);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    /* Library Viewer Gallery Pane */
    .gallery-pane-wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      padding: 1.25rem 1.5rem;
      overflow-y: auto;
    }

    .gallery-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--card-border);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    @media (min-width: 1400px) {
      .grid-container {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 20px;
      }
    }

    .grid-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .grid-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .grid-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #0f172a;
      overflow: hidden;
    }

    .grid-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .grid-card:hover .grid-thumb img {
      transform: scale(1.06);
    }

    .grid-info {
      padding: 10px 12px;
    }

    .grid-name {
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grid-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
    }

    /* Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(24px);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
    }

    .lightbox-img {
      max-width: 90%;
      max-height: 82vh;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 14px 50px rgba(0, 0, 0, 0.85);
    }

    .lightbox-bar {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }
  </style>
</head>
<body>

  <!-- Top App Navigation -->
  <header>
    <div class="brand">
      <div class="logo-badge">I3</div>
      <div>
        <h1>Imagen AI Studio</h1>
      </div>
    </div>

    <!-- Mobile-Only Toggle Switcher -->
    <div class="mobile-view-toggle">
      <button class="tab-btn active" id="tabChat" data-view="chatPane">💬 Chat</button>
      <button class="tab-btn" id="tabGallery" data-view="galleryPane">🖼️ Library</button>
    </div>

    <!-- Google Drive Sync Status -->
    <div class="drive-status" id="driveStatus">
      <span class="dot" id="statusDot"></span>
      <span id="statusText" style="display: none; @media(min-width: 640px){ display: inline; }">Drive</span>
      <button id="connectDriveBtn" class="auth-btn" style="display: none;">Connect Drive</button>
      <button id="disconnectDriveBtn" class="disconnect-btn" style="display: none;">Disconnect</button>
    </div>
  </header>

  <main>
    <!-- LEFT PANE: Chat Stream Generation -->
    <section class="pane active" id="chatPane">
      <div class="chat-pane-wrapper">
        <div class="chat-messages" id="chatMessages">
          <div class="message ai">
            <div class="ai-content">
              <div style="font-weight: 700; font-size: 0.95rem; margin-bottom: 4px;">Welcome to Imagen 3 Studio ✨</div>
              <div style="font-size: 0.82rem; color: var(--text-muted);">
                Describe any image idea below. Generated images sync in real-time to your Google Drive library on the right!
              </div>
            </div>
          </div>
        </div>

        <!-- Chat Input Bar -->
        <div class="chat-input-bar">
          <div class="pill-options">
            <span style="font-size: 0.72rem; color: var(--text-muted); align-self: center; margin-right: 2px;">Model:</span>
            <button class="option-chip active" data-type="model" data-val="flux">⚡ FLUX.1</button>
            <button class="option-chip" data-type="model" data-val="flux-realism">✨ Photoreal</button>
            <button class="option-chip" data-type="model" data-val="flux-anime">🎨 Anime</button>
            <button class="option-chip" data-type="model" data-val="turbo">🚀 SDXL Turbo</button>

            <span style="font-size: 0.72rem; color: var(--text-muted); align-self: center; margin: 0 4px 0 8px;">Style:</span>
            <button class="option-chip active" data-type="style" data-val="editorial">📸 Editorial</button>
            <button class="option-chip" data-type="style" data-val="cinematic">🎬 Cinematic</button>
            <button class="option-chip" data-type="style" data-val="fineart">🖼️ Fine Art</button>
            <button class="option-chip" data-type="style" data-val="noir">🌑 Noir</button>
            <button class="option-chip" data-type="style" data-val="raw">⚡ Raw</button>

            <span style="font-size: 0.72rem; color: var(--text-muted); align-self: center; margin: 0 4px 0 8px;">Ratio:</span>
            <button class="option-chip active" data-type="ratio" data-val="1:1">1:1</button>
            <button class="option-chip" data-type="ratio" data-val="16:9">16:9</button>
            <button class="option-chip" data-type="ratio" data-val="9:16">9:16</button>
            <button class="option-chip" data-type="ratio" data-val="4:3">4:3</button>
          </div>

          <div class="input-row">
            <input type="text" id="chatInput" class="input-box" placeholder="Ask Imagen to generate an image..." enterkeyhint="send" />
            <button id="sendBtn" class="send-btn">➔</button>
          </div>
        </div>
      </div>
    </section>

    <!-- RIGHT PANE: Google Drive Library Viewer -->
    <section class="pane" id="galleryPane">
      <div class="gallery-pane-wrapper">
        <div class="gallery-topbar">
          <div>
            <h2 style="font-size: 1.1rem; font-weight: 700;">Google Drive Library</h2>
            <div style="font-size: 0.75rem; color: var(--text-muted);">Folder: Imagen-AI-Gallery</div>
          </div>
          <div style="display: flex; gap: 8px;">
            <a id="driveFolderLink" href="https://drive.google.com" target="_blank" class="action-pill">📂 Open Drive</a>
            <button id="refreshGridBtn" class="action-pill" style="cursor: pointer;">🔄 Refresh</button>
          </div>
        </div>
        <div class="grid-container" id="gridContainer">
          <!-- Populated from Drive -->
        </div>
      </div>
    </section>
  </main>

  <!-- Fullscreen Modal / Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">×</button>
    <img class="lightbox-img" id="lightboxImg" alt="Enlarged" />
    <div class="lightbox-bar">
      <a id="lightboxDriveLink" href="#" target="_blank" class="action-pill" style="font-size: 0.85rem; padding: 8px 14px;">📂 View in Google Drive</a>
      <a id="lightboxDownload" href="#" download="generated.jpg" class="action-pill" style="font-size: 0.85rem; padding: 8px 14px;">⬇️ Download</a>
    </div>
  </div>

  <script>
    let selectedModel = "flux";
    let selectedStyle = "editorial";
    let selectedRatio = "1:1";

    const tabChat = document.getElementById("tabChat");
    const tabGallery = document.getElementById("tabGallery");
    const chatPane = document.getElementById("chatPane");
    const galleryPane = document.getElementById("galleryPane");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const gridContainer = document.getElementById("gridContainer");
    const statusDot = document.getElementById("statusDot");
    const connectDriveBtn = document.getElementById("connectDriveBtn");
    const disconnectDriveBtn = document.getElementById("disconnectDriveBtn");
    const driveFolderLink = document.getElementById("driveFolderLink");
    const refreshGridBtn = document.getElementById("refreshGridBtn");

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxClose = document.getElementById("lightboxClose");
    const lightboxDriveLink = document.getElementById("lightboxDriveLink");
    const lightboxDownload = document.getElementById("lightboxDownload");

    // Mobile View Toggle Handlers
    tabChat.addEventListener("click", () => {
      tabChat.classList.add("active");
      tabGallery.classList.remove("active");
      chatPane.classList.add("active");
      galleryPane.classList.remove("active");
    });

    tabGallery.addEventListener("click", () => {
      tabGallery.classList.add("active");
      tabChat.classList.remove("active");
      galleryPane.classList.add("active");
      chatPane.classList.remove("active");
      loadDriveFiles();
    });

    // Style & Ratio Selectors
    document.querySelectorAll(".option-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const type = chip.getAttribute("data-type");
        const val = chip.getAttribute("data-val");
        document.querySelectorAll(`.option-chip[data-type="${type}"]`).forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        if (type === "model") selectedModel = val;
        if (type === "style") selectedStyle = val;
        if (type === "ratio") selectedRatio = val;
      });
    });

    // Connect & Disconnect buttons
    connectDriveBtn.addEventListener("click", () => window.location.href = "/api/auth/login");
    disconnectDriveBtn.addEventListener("click", () => window.location.href = "/api/auth/logout");

    // Load Drive Files & Check Status
    async function loadDriveFiles() {
      try {
        const res = await fetch("/api/drive/files");
        const data = await res.json();

        if (data.connected) {
          statusDot.style.background = "#34d399";
          statusDot.style.boxShadow = "0 0 8px #34d399";
          connectDriveBtn.style.display = "none";
          disconnectDriveBtn.style.display = "inline-block";
        } else {
          statusDot.style.background = "#f59e0b";
          statusDot.style.boxShadow = "0 0 8px #f59e0b";
          connectDriveBtn.style.display = "inline-block";
          disconnectDriveBtn.style.display = "none";
        }

        if (data.folderId) {
          driveFolderLink.href = `https://drive.google.com/drive/folders/${data.folderId}`;
        }

        gridContainer.innerHTML = "";
        if (!data.files || data.files.length === 0) {
          gridContainer.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No images in Drive folder yet.</div>`;
          return;
        }

        data.files.forEach(file => {
          const card = document.createElement("div");
          card.className = "grid-card";
          const thumbUrl = `https://lh3.googleusercontent.com/u/0/d/${file.id}=w400`;
          const viewUrl = `https://drive.google.com/file/d/${file.id}/view`;

          card.innerHTML = `
            <div class="grid-thumb">
              <img src="${thumbUrl}" alt="${file.name}" loading="lazy" />
            </div>
            <div class="grid-info">
              <div class="grid-name">${file.name}</div>
              <div class="grid-meta">
                <span>${file.size ? (parseInt(file.size)/1024).toFixed(0) + ' KB' : 'Saved'}</span>
                <span>${file.modifiedTime ? new Date(file.modifiedTime).toLocaleDateString() : ''}</span>
              </div>
            </div>
          `;
          card.addEventListener("click", () => openLightbox(thumbUrl, viewUrl));
          gridContainer.appendChild(card);
        });
      } catch (err) {
        console.error(err);
      }
    }

    refreshGridBtn.addEventListener("click", loadDriveFiles);

    // Lightbox modal handler
    function openLightbox(imgSrc, driveUrl) {
      lightboxImg.src = imgSrc;
      lightboxDriveLink.href = driveUrl;
      lightboxDownload.href = imgSrc;
      lightbox.classList.add("active");
    }

    lightboxClose.addEventListener("click", () => lightbox.classList.remove("active"));
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) lightbox.classList.remove("active");
    });

    // Send Generation Request (Chat Experience)
    async function handleSend() {
      const prompt = chatInput.value.trim();
      if (!prompt) return;

      chatInput.value = "";

      // Append User message
      const userMsg = document.createElement("div");
      userMsg.className = "message user";
      userMsg.textContent = prompt;
      chatMessages.appendChild(userMsg);

      // Append AI loading bubble
      const aiMsg = document.createElement("div");
      aiMsg.className = "message ai";
      aiMsg.innerHTML = `
        <div class="ai-content" style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 14px; height: 14px; border: 2px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
          <span style="font-size: 0.82rem; color: var(--text-muted);">Generating with AI...</span>
        </div>
      `;
      chatMessages.appendChild(aiMsg);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt,
            aspectRatio: selectedRatio,
            style: selectedStyle,
            model: selectedModel,
            uploadToDrive: true
          })
        });

        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || "Generation failed");

        const driveLink = data.driveResult?.driveFileId
          ? `<a href="https://drive.google.com/file/d/${data.driveResult.driveFileId}/view" target="_blank" class="action-pill">📂 Saved to Drive ↗</a>`
          : `<span style="font-size: 0.72rem; color: #f59e0b;">(Drive Sync Pending)</span>`;

        aiMsg.innerHTML = `
          <div class="ai-img-wrapper">
            <img src="${data.dataUrl}" alt="Generated result" />
          </div>
          <div class="ai-content">
            <div class="ai-prompt">${prompt}</div>
            <div class="ai-actions">
              <span>Ratio: <b>${selectedRatio}</b> · Style: <b>${selectedStyle}</b></span>
              ${driveLink}
            </div>
          </div>
        `;

        const generatedImg = aiMsg.querySelector("img");
        generatedImg.addEventListener("click", () => {
          const driveUrl = data.driveResult?.driveFileId
            ? `https://drive.google.com/file/d/${data.driveResult.driveFileId}/view`
            : "#";
          openLightbox(data.dataUrl, driveUrl);
        });

        // Auto-refresh gallery on the right
        loadDriveFiles();

      } catch (err) {
        aiMsg.innerHTML = `
          <div class="ai-content" style="color: #ef4444; font-size: 0.82rem;">
            ⚠️ <b>Generation Error:</b> ${err.message}
          </div>
        `;
      } finally {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    sendBtn.addEventListener("click", handleSend);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSend();
    });

    // Initial check
    loadDriveFiles();
  </script>
</body>
</html>
