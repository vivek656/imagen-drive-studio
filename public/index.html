<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Imagen AI Studio & Drive Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141b2b;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --bubble-user: #232738;
      --bubble-ai: #161e31;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      height: 60px;
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--card-border);
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .brand h1 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* Mobile view toggle (hidden on desktop) */
    .mobile-view-toggle {
      display: none;
      background: rgba(15, 23, 42, 0.8);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    @media (max-width: 1023px) {
      .mobile-view-toggle {
        display: flex;
      }
    }

    .tab-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .drive-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
    }

    .auth-btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .disconnect-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Main Grid Layout */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 560px 1fr;
      overflow: hidden;
      min-height: 0;
    }

    @media (max-width: 1023px) {
      main {
        display: flex;
        flex-direction: column;
      }
      .pane {
        display: none !important;
        width: 100%;
        height: 100%;
      }
      .pane.active {
        display: flex !important;
      }
    }

    /* Left Pane: Chat Studio */
    #chatPane {
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      background: rgba(11, 15, 25, 0.5);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.25rem 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
      min-height: 0;
    }

    .message {
      max-width: 92%;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--bubble-user);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 16px;
      border-radius: 16px 16px 4px 16px;
      font-size: 0.95rem;
    }

    .message.ai {
      align-self: flex-start;
      background: var(--bubble-ai);
      border: 1px solid var(--card-border);
      border-radius: 16px 16px 16px 4px;
      overflow: hidden;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    /* FULL UNCROPPED IMAGE DISPLAY */
    .ai-img-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .ai-img-wrapper img {
      width: 100%;
      height: auto;
      max-height: 520px;
      object-fit: contain;
      display: block;
      border-bottom: 1px solid var(--card-border);
    }

    .ai-content {
      padding: 12px 16px;
    }

    .ai-prompt {
      font-size: 0.88rem;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .ai-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
    }

    .action-pill {
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--card-border);
      transition: all 0.2s;
    }

    .action-pill:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* Modern Dropdown & Chip Controls (Clean UX, No Infinite Horizontal Scrolling) */
    .chat-controls-wrapper {
      background: #111726;
      border-top: 1px solid var(--card-border);
      padding: 12px 16px;
      flex-shrink: 0;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .control-select-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .control-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .styled-select {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 10px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
      width: 100%;
    }

    .styled-select:focus {
      border-color: var(--accent);
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .input-box:focus {
      border-color: var(--accent);
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s;
    }

    .send-btn:hover {
      transform: scale(1.03);
    }

    /* Right Pane: Google Drive Gallery */
    #galleryPane {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      background: var(--bg);
    }

    .gallery-header {
      padding: 1rem 1.75rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .gallery-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      min-height: 0;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    @media (min-width: 1440px) {
      .grid-container {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 20px;
      }
    }

    .grid-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .grid-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      border-color: rgba(99, 102, 241, 0.5);
    }

    .grid-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000;
      overflow: hidden;
    }

    .grid-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .grid-card:hover .grid-thumb img {
      transform: scale(1.05);
    }

    .grid-info {
      padding: 10px 12px;
    }

    .grid-name {
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grid-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
    }

    /* Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(20px);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
    }

    .lightbox-img {
      max-width: 92%;
      max-height: 82vh;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.9);
    }

    .lightbox-bar {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-badge">I3</div>
      <div>
        <h1>Imagen AI Studio</h1>
      </div>
    </div>

    <!-- Mobile Switcher -->
    <div class="mobile-view-toggle">
      <button class="tab-btn active" id="tabChat">💬 Chat</button>
      <button class="tab-btn" id="tabGallery">🖼️ Library</button>
    </div>

    <!-- Google Drive Sync Status -->
    <div class="drive-status" id="driveStatus">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Checking Drive...</span>
      <button id="connectDriveBtn" class="auth-btn" style="display: none;">🔗 Connect Drive</button>
      <button id="disconnectDriveBtn" class="disconnect-btn" style="display: none;">Disconnect</button>
    </div>
  </header>

  <main>
    <!-- LEFT: Chat Generation Studio -->
    <section class="pane active" id="chatPane">
      <div class="chat-messages" id="chatMessages">
        <div class="message ai">
          <div class="ai-content">
            <div style="font-weight: 700; font-size: 0.95rem; margin-bottom: 4px;">Welcome to AI Studio ✨</div>
            <div style="font-size: 0.82rem; color: var(--text-muted);">
              Type any prompt below. Images generate in high-res and automatically backup to your Google Drive library on the right!
            </div>
          </div>
        </div>
      </div>

      <!-- Controls & Input Bar (Clean Dropdowns, No Endless Scrolling) -->
      <div class="chat-controls-wrapper">
        <div class="controls-grid">
          <div class="control-select-group">
            <label class="control-label">AI Model</label>
            <select id="modelSelect" class="styled-select">
              <option value="flux">⚡ FLUX.1 (Flagship)</option>
              <option value="flux-realism">✨ Photoreal</option>
              <option value="flux-anime">🎨 Anime / Concept</option>
              <option value="turbo">🚀 SDXL Turbo</option>
            </select>
          </div>

          <div class="control-select-group">
            <label class="control-label">Aesthetic Style</label>
            <select id="styleSelect" class="styled-select">
              <option value="editorial">📸 Editorial (Leibovitz)</option>
              <option value="cinematic">🎬 Cinematic (Villeneuve)</option>
              <option value="fineart">🖼️ Fine Art</option>
              <option value="noir">🌑 Noir</option>
              <option value="raw">⚡ Raw (Unenhanced)</option>
            </select>
          </div>

          <div class="control-select-group">
            <label class="control-label">Aspect Ratio</label>
            <select id="ratioSelect" class="styled-select">
              <option value="1:1">Square (1:1)</option>
              <option value="16:9">Landscape (16:9)</option>
              <option value="9:16">Portrait / Mobile (9:16)</option>
              <option value="4:3">Standard (4:3)</option>
              <option value="3:4">Tall (3:4)</option>
            </select>
          </div>
        </div>

        <div class="input-row">
          <input type="text" id="chatInput" class="input-box" placeholder="Describe the image you want to create..." enterkeyhint="send" />
          <button id="sendBtn" class="send-btn">➔</button>
        </div>
      </div>
    </section>

    <!-- RIGHT: Google Drive Gallery -->
    <section class="pane" id="galleryPane">
      <div class="gallery-header">
        <div>
          <h2 style="font-size: 1.1rem; font-weight: 700;">Google Drive Library</h2>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Saved in: Imagen-AI-Gallery</div>
        </div>
        <div style="display: flex; gap: 8px;">
          <a id="driveFolderLink" href="https://drive.google.com" target="_blank" class="action-pill">📂 Open Folder in Drive</a>
          <button id="refreshGridBtn" class="action-pill" style="cursor: pointer;">🔄 Refresh</button>
        </div>
      </div>

      <div class="gallery-content">
        <div class="grid-container" id="gridContainer">
          <!-- Populated from Google Drive -->
        </div>
      </div>
    </section>
  </main>

  <!-- Fullscreen Modal / Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">×</button>
    <img class="lightbox-img" id="lightboxImg" alt="Enlarged" />
    <div class="lightbox-bar">
      <a id="lightboxDriveLink" href="#" target="_blank" class="action-pill" style="font-size: 0.85rem; padding: 8px 14px;">📂 View in Google Drive</a>
      <a id="lightboxDownload" href="#" download="generated.jpg" class="action-pill" style="font-size: 0.85rem; padding: 8px 14px;">⬇️ Download</a>
    </div>
  </div>

  <script>
    const tabChat = document.getElementById("tabChat");
    const tabGallery = document.getElementById("tabGallery");
    const chatPane = document.getElementById("chatPane");
    const galleryPane = document.getElementById("galleryPane");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const modelSelect = document.getElementById("modelSelect");
    const styleSelect = document.getElementById("styleSelect");
    const ratioSelect = document.getElementById("ratioSelect");
    const gridContainer = document.getElementById("gridContainer");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const connectDriveBtn = document.getElementById("connectDriveBtn");
    const disconnectDriveBtn = document.getElementById("disconnectDriveBtn");
    const driveFolderLink = document.getElementById("driveFolderLink");
    const refreshGridBtn = document.getElementById("refreshGridBtn");

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxClose = document.getElementById("lightboxClose");
    const lightboxDriveLink = document.getElementById("lightboxDriveLink");
    const lightboxDownload = document.getElementById("lightboxDownload");

    // Mobile Switchers
    tabChat.addEventListener("click", () => {
      tabChat.classList.add("active");
      tabGallery.classList.remove("active");
      chatPane.classList.add("active");
      galleryPane.classList.remove("active");
    });

    tabGallery.addEventListener("click", () => {
      tabGallery.classList.add("active");
      tabChat.classList.remove("active");
      galleryPane.classList.add("active");
      chatPane.classList.remove("active");
      loadDriveFiles();
    });

    connectDriveBtn.addEventListener("click", () => window.location.href = "/api/auth/login");
    disconnectDriveBtn.addEventListener("click", () => window.location.href = "/api/auth/logout");

    // Fetch Google Drive Files
    async function loadDriveFiles() {
      try {
        const res = await fetch("/api/drive/files");
        const data = await res.json();

        if (data.connected) {
          statusDot.style.background = "#34d399";
          statusDot.style.boxShadow = "0 0 10px #34d399";
          statusText.textContent = "Google Drive Connected";
          connectDriveBtn.style.display = "none";
          disconnectDriveBtn.style.display = "inline-block";
        } else {
          statusDot.style.background = "#f59e0b";
          statusDot.style.boxShadow = "0 0 10px #f59e0b";
          statusText.textContent = "Drive Not Connected";
          connectDriveBtn.style.display = "inline-block";
          disconnectDriveBtn.style.display = "none";
        }

        if (data.folderId) {
          driveFolderLink.href = `https://drive.google.com/drive/folders/${data.folderId}`;
        }

        gridContainer.innerHTML = "";
        if (!data.files || data.files.length === 0) {
          gridContainer.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 60px 20px;">
              <div style="font-size: 2rem; margin-bottom: 8px;">📂</div>
              <div style="font-weight: 600;">No images in Drive folder yet</div>
              <div style="font-size: 0.8rem; margin-top: 4px;">Connect Drive and generate an image to sync it here!</div>
            </div>`;
          return;
        }

        data.files.forEach(file => {
          const card = document.createElement("div");
          card.className = "grid-card";
          const thumbUrl = `https://lh3.googleusercontent.com/u/0/d/${file.id}=w400`;
          const viewUrl = `https://drive.google.com/file/d/${file.id}/view`;

          card.innerHTML = `
            <div class="grid-thumb">
              <img src="${thumbUrl}" alt="${file.name}" loading="lazy" />
            </div>
            <div class="grid-info">
              <div class="grid-name">${file.name}</div>
              <div class="grid-meta">
                <span>${file.size ? (parseInt(file.size)/1024).toFixed(0) + ' KB' : 'Saved'}</span>
                <span>${file.modifiedTime ? new Date(file.modifiedTime).toLocaleDateString() : ''}</span>
              </div>
            </div>
          `;
          card.addEventListener("click", () => openLightbox(thumbUrl, viewUrl));
          gridContainer.appendChild(card);
        });
      } catch (err) {
        console.error(err);
      }
    }

    refreshGridBtn.addEventListener("click", loadDriveFiles);

    function openLightbox(imgSrc, driveUrl) {
      lightboxImg.src = imgSrc;
      lightboxDriveLink.href = driveUrl;
      lightboxDownload.href = imgSrc;
      lightbox.classList.add("active");
    }

    lightboxClose.addEventListener("click", () => lightbox.classList.remove("active"));
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) lightbox.classList.remove("active");
    });

    // Handle Generation
    async function handleSend() {
      const prompt = chatInput.value.trim();
      if (!prompt) return;

      chatInput.value = "";

      const userMsg = document.createElement("div");
      userMsg.className = "message user";
      userMsg.textContent = prompt;
      chatMessages.appendChild(userMsg);

      const aiMsg = document.createElement("div");
      aiMsg.className = "message ai";
      aiMsg.innerHTML = `
        <div class="ai-content" style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 14px; height: 14px; border: 2px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
          <span style="font-size: 0.85rem; color: var(--text-muted);">Generating image with ${modelSelect.options[modelSelect.selectedIndex].text}...</span>
        </div>
      `;
      chatMessages.appendChild(aiMsg);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt,
            aspectRatio: ratioSelect.value,
            style: styleSelect.value,
            model: modelSelect.value,
            uploadToDrive: true
          })
        });

        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || "Generation failed");

        const driveLink = data.driveResult?.driveFileId
          ? `<a href="https://drive.google.com/file/d/${data.driveResult.driveFileId}/view" target="_blank" class="action-pill">📂 Saved to Drive ↗</a>`
          : `<span style="font-size: 0.72rem; color: #f59e0b;">(Saved Locally)</span>`;

        aiMsg.innerHTML = `
          <div class="ai-img-wrapper">
            <img src="${data.dataUrl}" alt="Generated result" />
          </div>
          <div class="ai-content">
            <div class="ai-prompt">${prompt}</div>
            <div class="ai-actions">
              <span><b>${ratioSelect.value}</b> · <b>${modelSelect.value}</b></span>
              ${driveLink}
            </div>
          </div>
        `;

        const generatedImg = aiMsg.querySelector("img");
        generatedImg.addEventListener("click", () => {
          const driveUrl = data.driveResult?.driveFileId
            ? `https://drive.google.com/file/d/${data.driveResult.driveFileId}/view`
            : "#";
          openLightbox(data.dataUrl, driveUrl);
        });

        // Trigger real-time library refresh
        loadDriveFiles();

      } catch (err) {
        aiMsg.innerHTML = `
          <div class="ai-content" style="color: #ef4444; font-size: 0.85rem;">
            ⚠️ <b>Generation Error:</b> ${err.message}
          </div>
        `;
      } finally {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    sendBtn.addEventListener("click", handleSend);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSend();
    });

    loadDriveFiles();
  </script>
</body>
</html>
